name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # buf breaking needs history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install buf and codegen plugins
        run: |
          go install github.com/bufbuild/buf/cmd/buf@latest
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - name: buf lint
        run: buf lint
      - name: buf breaking (vs previous commit)
        run: buf breaking --against '.git#ref=HEAD~1'
      - name: generated Go stubs up to date
        run: |
          buf generate
          git diff --exit-code gen/

  go:
    runs-on: ubuntu-latest
    services:
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --health-cmd "nc -z 127.0.0.1 4222"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal pkg)"
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - run: go build ./...
      - name: daemon smoke (flag parsing / import-time errors)
        run: |
          go build -o bin/afepd ./cmd/afepd
          ./bin/afepd -h
      - run: go test -race -count=1 ./... # live Jetstream test runs against the service
      - name: fuzz smoke
        run: |
          go test -run='^$' -fuzz=FuzzParseSubject -fuzztime=10s ./internal/bus/nats/
          go test -run='^$' -fuzz=FuzzTaskstoreOpen -fuzztime=10s ./internal/taskstore/
          go test -run='^$' -fuzz=FuzzEnvelopeBytes -fuzztime=10s ./internal/identity/

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Interop fixtures parse (stdlib sanity)
        run: python -c "import json, glob; [json.load(open(p)) for p in glob.glob('python/testdata/*.json')]; print('fixtures ok')"
      - name: Install package
        run: pip install -e ./python
      - name: Unit + cross-language interop tests
        working-directory: python
        run: python -m unittest discover -s tests -v
