# AFEP federation — edge site.
# Outbound-only dial tone: the edge needs no inbound ports; it dials the
# core's leafnode port and both sites share one subject namespace.
server_name: afep-edge
port: 4222

http: 8222

jetstream {
  store_dir: /data
}

leafnodes {
  remotes: [
    { urls: [ "nats://afep-core:7422" ] }
  ]
}
