# AFEP federation — edge site.
# Outbound-only dial tone: the edge needs no inbound ports; it dials the
# core's leafnode port and both sites share one subject namespace.
server_name: afep-edge
port: 4222

http: 8222

# Client port also requires credentials (replace CHANGE_ME_*).
authorization {
  user: afep
  password: CHANGE_ME_FEDERATION
}

jetstream {
  store_dir: /data
}

leafnodes {
  remotes: [
    { urls: [ "nats://leaf:CHANGE_ME_LEAF@afep-core:7422" ] }
  ]
}
