# AFEP federation — core site (hub).
# Dev template: leaf port stays inside the compose network; only the
# client port is published for local tooling. Production: real TLS + auth.
server_name: afep-core
port: 4222

http: 8222

# Dev template with AUTH ENABLED: replace CHANGE_ME_* before any real
# deployment and pass client credentials to afepd via AFEP_NATS_USER /
# AFEP_NATS_PASS (never via argv).
authorization {
  user: afep
  password: CHANGE_ME_FEDERATION
}

jetstream {
  store_dir: /data
}

leafnodes {
  port: 7422
  authorization {
    user: leaf
    password: CHANGE_ME_LEAF
  }
}
