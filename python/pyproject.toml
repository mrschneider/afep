[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afep"
version = "0.2.0"
description = "AFEP Python reference: identity, lifecycle, subject scheme, interop fixtures"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["protobuf>=7.36.2", "cryptography>=42.0"]

[tool.setuptools]
packages = ["afep", "afep.v1"]
