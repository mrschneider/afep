[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afep"
version = "0.5.0"
description = "AFEP Python reference: identity, lifecycle, subject scheme, interop fixtures"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Guilherme Schneider" }]
requires-python = ">=3.12"
dependencies = ["protobuf>=7.36.2", "cryptography>=42.0"]
keywords = [
  "agents",
  "federation",
  "grpc",
  "nats",
  "jetstream",
  "a2a",
  "protocol",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications",
  "Topic :: Software Development :: Frameworks",
]

[project.urls]
Homepage = "https://github.com/mrschneider/afep"
Repository = "https://github.com/mrschneider/afep"
Changelog = "https://github.com/mrschneider/afep/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/mrschneider/afep/issues"

[tool.setuptools]
packages = ["afep", "afep.v1"]
